name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp/gcp-finops/pyproject.toml

      - name: Install gcp-finops MCP (with dev deps)
        run: pip install -e "./mcp/gcp-finops[dev]"

      - name: Run pytest
        run: pytest -v
        working-directory: mcp/gcp-finops

  validate-schemas:
    name: validate skill JSON schemas + SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Every output.schema.json must be a valid Draft-07 schema
        run: |
          fail=0
          for f in skills/*/output.schema.json; do
            echo "checking $f"
            python -c "
          import json, jsonschema, sys
          try:
              schema = json.load(open('$f'))
              jsonschema.Draft7Validator.check_schema(schema)
              print('  OK')
          except Exception as e:
              print(f'  FAIL: {e}', file=sys.stderr); sys.exit(1)
          " || fail=1
          done
          exit $fail

      - name: Every SKILL.md must have frontmatter with name + description
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            head=$(head -10 "$f")
            if ! echo "$head" | grep -q '^name:'; then
              echo "FAIL: $f is missing frontmatter 'name:'"; fail=1
            fi
            if ! echo "$head" | grep -q '^description:'; then
              echo "FAIL: $f is missing frontmatter 'description:'"; fail=1
            fi
          done
          if [ $fail -eq 0 ]; then
            echo "All SKILL.md frontmatters OK"
          fi
          exit $fail

      - name: Skill name in frontmatter must match its directory name
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            dir=$(dirname "$f")
            expected=$(basename "$dir")
            actual=$(grep '^name:' "$f" | head -1 | sed 's/^name: *//')
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: $f has name: '$actual' but lives in directory '$expected'"
              fail=1
            fi
          done
          exit $fail
