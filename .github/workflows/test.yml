name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp/gcp-finops/pyproject.toml

      - name: Install gcp-finops MCP (with dev deps)
        run: pip install -e "./mcp/gcp-finops[dev]"

      - name: Run pytest
        run: pytest -v
        working-directory: mcp/gcp-finops

  pytest-dispute-kit:
    name: pytest (gcp-dispute-kit skill)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest jsonschema

      - name: Run dispute-kit tests
        run: python -m pytest skills/gcp-dispute-kit/tests -v

  validate-schemas:
    name: validate skill JSON schemas + SKILL.md frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate all schemas + frontmatter
        run: python .github/scripts/validate_schemas.py

  bandit:
    name: bandit (static security analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit[toml]"

      - name: Run bandit on MCP server source
        # -ll surfaces Medium + High severity findings.
        # -c points bandit at our pyproject.toml [tool.bandit] config which
        # globally skips B608 (a Medium-confidence false positive that fires
        # on every f-string-looking-like-SQL — our queries are parameterised).
        # The exit code is non-zero on findings, which fails the job.
        run: bandit -r mcp/gcp-finops/src -ll -c mcp/gcp-finops/pyproject.toml

  pip-audit:
    name: pip-audit (dependency CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Extract runtime deps from pyproject.toml
        # pip-audit can't resolve our local package against PyPI (and it
        # shouldn't have to). Audit just the declared runtime dependencies.
        run: |
          python - <<'PY'
          import tomllib
          deps = tomllib.load(open("mcp/gcp-finops/pyproject.toml", "rb"))["project"]["dependencies"]
          with open("/tmp/runtime-requirements.txt", "w") as f:
              f.write("\n".join(deps) + "\n")
          print(open("/tmp/runtime-requirements.txt").read())
          PY

      - name: Audit runtime deps for known CVEs
        # Strict mode: fail on any known vulnerability.
        run: pip-audit -r /tmp/runtime-requirements.txt --strict
